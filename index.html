<!DOCTYPE html>
<!--
  ============================================
  📄 index.html — The Single HTML Entry Point
  ============================================

  In React, this is the only HTML file. React takes over from here
  and dynamically builds the entire page using JavaScript.

  KEY THINGS TO NOTICE:
  - We load TWO fonts: "JetBrains Mono" (monospace, for that coder look)
    and "Inter" (clean sans-serif for body text)
  - The <div id="root"> is where React mounts your entire app
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
